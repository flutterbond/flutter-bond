name: bond
description: Bond project.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.6.0

  flutter_localizations:
    sdk: flutter

  # Bond packages
  bond_core: ^0.1.0
  bond_cache: ^0.1.0
  bond_network: ^0.1.0
  bond_form: ^0.1.0
  bond_form_riverpod: ^0.1.0
  bond_app_analytics: ^0.2.0
  bond_notifications: ^0.2.0

  get_it: ^9.3.0

  # network
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0

  # serialization
  json_annotation: ^4.12.0

  # ui
  flutter_svg: ^2.3.0
  google_fonts: ^9.0.0

  # state management
  flutter_riverpod: ^3.4.3
  equatable: ^3.0.0

  # navigation
  go_router: ^18.0.2

  # utils
  flutter_native_splash: ^2.4.8
  device_info_plus: ^13.3.0

  # platforms packages
  universal_platform: ^1.1.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  package_info_plus: ^10.2.2
  flutter_local_notifications: ^22.3.1
  in_app_review: ^2.0.12
  share_plus: ^13.3.1

  # Firebase
  firebase_analytics: ^12.6.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_crashlytics: ^5.4.0
  firebase_remote_config: ^6.7.0

  # localization
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
